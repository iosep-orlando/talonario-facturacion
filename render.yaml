# Despliegue en Render como Blueprint. Ver la sección "Despliegue" del README.
services:
  - type: web
    name: talonario-facturacion
    runtime: node
    plan: free
    region: virginia # junto al clúster de MongoDB Atlas (AWS us-east-1)
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MONGODB_DB
        value: saas_facturacion
      # Render gratis bloquea los puertos SMTP: la demo guarda los mails en
      # la base y los muestra en /bandeja.
      - key: MAIL_TRANSPORT
        value: outbox
      # Render inventa el secreto al crear el servicio.
      - key: JWT_SECRET
        generateValue: true
      # Secretos: no van en el repositorio. Render los pide al crear el servicio.
      - key: MONGODB_URI
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_USERNAME
        sync: false
      - key: AWS_PASSWORD
        sync: false
